# Server satuan (on-premise). Jalankan dari folder deploy/:
#   cp .env.production.example .env   # lalu isi
#   docker compose up -d --build
# Dashboard + API tersedia di http://<ip-server>/ (extension diarahkan ke alamat yang sama).
services:
  api:
    build: ../backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      REPORTS_DB_PATH: var/narasi.db
    volumes:
      - narasi-data:/app/var
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build: ../dashboard
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Cache kolektif disimpan ke disk: hasil LLM tidak hilang saat restart, jadi kuota tidak terpakai ulang.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - narasi-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  narasi-data:
  narasi-cache:
